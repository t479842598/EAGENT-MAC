appId: com.t479842598.eagent
productName: EAgent
copyright: Copyright © 2026 t479842598
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - resources/**
artifactName: EAgent-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
    - target: zip
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  extendInfo:
    NSCameraUsageDescription: 不使用
    NSMicrophoneUsageDescription: 不使用
dmg:
  title: EAgent ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  executableName: EAgent
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EAgent
