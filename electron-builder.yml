appId: com.t479842598.eagent
productName: EAgent
copyright: Copyright © 2026 t479842598
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - resources/**
artifactName: EAgent-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
    - target: zip
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  extendInfo:
    NSCameraUsageDescription: 不使用
    NSMicrophoneUsageDescription: 不使用
dmg:
  title: EAgent ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
win:
  # 不在这里写死 arch —— 由 CLI 的 --x64 / --arm64 决定，
  # 否则 CI 矩阵里两个 Windows job 都会各打两份，artifacts 体积翻倍且互相覆盖。
  target:
    - nsis
    - zip
  executableName: EAgent
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EAgent
